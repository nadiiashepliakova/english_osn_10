<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Grade 10 (основний рівень)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f7f9fc 0%, #e9eef4 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      color: #0a2942;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem 1.2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      word-break: break-word;
    }

    h1 .line {
      display: block;
      padding-bottom: 0.3rem;
      border-bottom: 3px solid #2f7d8c;
      margin-bottom: 0.3rem;
    }

    h1 .line:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    /* Кнопка на розділ «Людські взаємини» */
     .btn {
            display: inline-block;
            background: #ffffff;
            color: #764ba2;
            border: none;
            padding: 20px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            max-width: 90%;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
            background: #f0f0f0;
        }

        .btn:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .section-btn {
        font-size: 1.05rem;
        padding: 0.8rem 1.6rem;
      }
    }
  </style>
</head>
<body>
  <h1>
    <span class="line">English</span>
    <span class="line">Grade 10</span>
    <span class="line">(основний рівень)</span>
  </h1>
<a class="btn" href="relationship.html" class="btn">Unit 3: Людські взаємини</a>
 
</body>
</html>
